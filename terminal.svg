<svg
  fill="none"
  viewBox="0 0 800 400"
  width="100%"
  height="400"
  xmlns="http://www.w3.org/2000/svg"
>
  <foreignObject width="100%" height="100%">
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      style="
        width: 100%;
        height: 100%;
        padding: 20px 40px 0 40px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');

        * {
          box-sizing: border-box;
        }

        .window {
          width: 100%;
          max-width: 700px;
          height: 350px;
          border-radius: 16px;
          background: linear-gradient(
            135deg,
            rgba(7, 27, 20, 0.95) 0%,
            rgba(3, 15, 12, 1) 58%,
            rgba(4, 26, 30, 0.95) 100%
          );
          border: 1px solid rgba(16, 185, 129, 0.3);
          box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(6, 182, 212, 0.1),
            0 0 30px rgba(16, 185, 129, 0.15),
            inset 0 0 20px rgba(16, 185, 129, 0.05);
          font-family: 'JetBrains Mono', monospace;
          overflow: hidden;
          position: relative;
        }

        .scanline {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            to bottom,
            transparent,
            rgba(6, 182, 212, 0.1),
            transparent
          );
          opacity: 0;
          animation: scan 4s ease-in-out infinite;
          pointer-events: none;
          z-index: 10;
        }

        @keyframes scan {
          0% {
            transform: translateY(-100%);
            opacity: 0;
          }

          20% {
            opacity: 0.5;
          }

          80% {
            opacity: 0.2;
          }

          100% {
            transform: translateY(100%);
            opacity: 0;
          }
        }

        .header {
          height: 45px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
          border-bottom: 1px solid rgba(16, 185, 129, 0.15);
          background: rgba(2, 12, 9, 0.6);
        }

        .dots {
          display: flex;
          gap: 6px;
          align-items: center;
        }

        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }

        .dot.red {
          background: #ff5f57;
        }

        .dot.yellow {
          background: #ffbd2e;
        }

        .dot.green {
          background: #28c840;
        }

        .title {
          font-size: 11px;
          color: rgba(163, 230, 211, 0.5);
          letter-spacing: 0.22em;
          white-space: nowrap;
        }

        .status {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 10px;
          color: rgba(16, 185, 129, 0.6);
          white-space: nowrap;
        }

        .status-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0%,
          100% {
            opacity: 0.5;
          }

          50% {
            opacity: 1;
          }
        }

        .body {
          height: 265px;
          padding: 20px 24px;
          display: flex;
          font-size: 13px;
          line-height: 23px;
          position: relative;
          overflow: hidden;
        }

        .gutter {
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          padding-right: 16px;
          color: #2d4a3e;
          user-select: none;
          flex-shrink: 0;
        }

        .gutter span {
          display: block;
          height: 23px;
          line-height: 23px;
        }

        .code {
          display: flex;
          flex-direction: column;
          min-width: 0;
          flex: 1;
          overflow: hidden;
        }

        .line {
          display: block;
          opacity: 1;
          transform: none;
          height: 23px;
          line-height: 23px;
          white-space: nowrap;
        }

        .cursor {
          display: inline-block;
          width: 8px;
          height: 15px;
          background: #10b981;
          vertical-align: middle;
          margin-left: 4px;
          animation: blink 1s step-end infinite;
        }

        @keyframes blink {
          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0;
          }
        }

        .footer {
          height: 40px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
          border-top: 1px solid rgba(16, 185, 129, 0.15);
          background: rgba(16, 185, 129, 0.09);
          color: #4b5563;
          font-size: 11px;
        }

        .footer-left,
        .footer-right {
          display: flex;
          gap: 12px;
          align-items: center;
        }

        .green-text {
          color: #10b981;
        }

        @media (max-width: 650px) {
          .window {
            height: 350px;
          }

          .header {
            height: 42px;
            padding: 0 12px;
          }

          .title {
            font-size: 9px;
            letter-spacing: 0.12em;
          }

          .status {
            font-size: 9px;
          }

          .body {
            height: 268px;
            padding: 18px;
            font-size: 10px;
          }

          .gutter {
            padding-right: 10px;
          }

          .gutter span,
          .line {
            height: 19px;
            line-height: 19px;
          }

          .footer {
            height: 40px;
            font-size: 9px;
            padding: 0 12px;
          }
        }
      </style>

      <div class="window">
        <div class="scanline"></div>

        <div class="header">
          <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
          </div>

          <div class="title">burakcankorpinar.dev</div>

          <div class="status">
            <div class="status-dot"></div>
            available
          </div>
        </div>

        <div class="body">
          <div class="gutter">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
          </div>

          <div class="code">
            <div class="line" style="color:#e2e8f0;">const developer = {</div>
            <div class="line" style="color:#a3e6d3;">  name: "Burak Can Körpınar",</div>
            <div class="line" style="color:#a3e6d3;">  role: "Full Stack Developer &amp; Computer Engineer",</div>
            <div class="line" style="color:#a3e6d3;">  stack: ["JavaScript", "TypeScript", "React", "Next.js", "Node.js"],</div>
            <div class="line" style="color:#93c5fd;">  expertise: ["E-Commerce", "REST APIs", "Docker", "SEO"],</div>
            <div class="line" style="color:#f59e0b;">  focus: "scalable &amp; user-friendly digital products",</div>
            <div class="line" style="color:#e2e8f0;">  build: () =&gt; {</div>
            <div class="line" style="color:#c084fc;">    return "modern digital experiences";</div>
            <div class="line" style="color:#e2e8f0;">  }</div>
            <div class="line" style="color:#e2e8f0;">}<span class="cursor"></span></div>
          </div>
        </div>

        <div class="footer">
          <div class="footer-left">
            <span class="green-text">⎇ main</span>
            <span>Ln 10, Col 2</span>
          </div>

          <div class="footer-right">
            <span class="green-text">● Live</span>
            <span>TypeScript</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
